services:
  - type: web
    name: mini-siem-web
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mini-siem-db
          property: connectionString

databases:
  - name: mini-siem-db
    plan: free
